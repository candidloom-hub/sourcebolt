name: bench

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BENCH_PKGS: ./internal/mcpserver ./internal/wire
  BENCH_RE: ToolCallNotebookList|Decode40KB

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # B7 binary size (fails at 20 MB), B6 connection reuse (test assertion
      # > 95%), B2 idle RSS (fails at 25 MB), B1 cold start (informational:
      # shared runners are too noisy for a hard 30 ms gate).
      - name: B7 binary size
        run: bash bench/binsize.sh bin/sourcebolt
      - name: B6 connection reuse
        run: go test ./internal/transport/rpc -run TestConnectionReuse -v -count=1
      - name: B2 idle RSS
        run: go run ./bench/rss -bin bin/sourcebolt -check
      - name: B1 cold start
        run: go run ./bench/coldstart -bin bin/sourcebolt

      # B3/B4: on pull requests benchmark base and head interleaved on this
      # runner (fair comparison; sequential runs showed 15-30% drift with
      # identical code). Allocation metrics gate at 10%, timings at 25%.
      - name: B3 and B4 benchmarks (interleaved base vs head)
        id: base
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && git cat-file -e "origin/${{ github.base_ref }}:internal/wire/bench_test.go" 2>/dev/null; then
            git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
            bash bench/interleave.sh "$RUNNER_TEMP/base" "$PWD" 10 $BENCH_PKGS
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            go test $BENCH_PKGS -run "^$" -bench "$BENCH_RE" -benchmem -count=10 | grep -v -e "^---" -e "bench_test.go" > new.txt
            echo "No base benchmarks to compare against; head results recorded only."
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: benchstat (alloc > 10% or time > 25% fails)
        if: steps.base.outputs.have == 'true'
        # Tool-call timing grows with the number of registered tools (GC scans
        # every tool schema; GOGC=off removes the gap). It is tracked against
        # the absolute B3 target in bench/RESULTS.md, not against the base.
        env:
          TIME_EXCLUDE: "^ToolCallNotebookList"
        run: bash bench/compare.sh old.txt new.txt 10 25

      - uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: bench-linux
          path: |
            new.txt
            old.txt
