name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: tool docs up to date
        run: go test ./tools/gendocs -run TestToolsDocFresh -count=1
      - name: fuzz smoke
        if: runner.os == 'Linux'
        run: go test ./internal/wire -run '^$' -fuzz FuzzDecode -fuzztime 20s
      - name: static build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o bin/ ./cmd/sourcebolt
