name: ci

on:
  push:
    branches: [main, "feat/**", "perf/**"]
  pull_request:
  # Weekly run of the installer jobs only (the Go jobs skip scheduled runs).
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: tool docs up to date
        run: go test ./tools/gendocs -run TestToolsDocFresh -count=1
      - name: fuzz smoke
        if: runner.os == 'Linux'
        run: |
          go test ./internal/wire -run '^$' -fuzz '^FuzzDecode$' -fuzztime 20s
          go test ./internal/wire -run '^$' -fuzz '^FuzzDecodeMatchesRef$' -fuzztime 20s
          go test ./internal/wire -run '^$' -fuzz '^FuzzNodeMatchesReference$' -fuzztime 10s
      - name: static build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o bin/ ./cmd/sourcebolt

  # DOM fallback against local HTML fixtures in headless Chrome (preinstalled
  # on ubuntu-latest). Fixtures only: no Google page is loaded.
  browser-dom:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: allow the Chrome sandbox
        # For GitHub-hosted ephemeral runners only: Ubuntu 24.04 restricts
        # unprivileged user namespaces, which the Chrome sandbox needs, and
        # the VM is discarded after the job. Do not copy this to a
        # self-hosted runner. A failure here fails the job visibly.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: DOM fallback tests
        env:
          NOTEBOOKLM_BROWSER_FALLBACK: "0"
        run: go test -tags browser ./internal/transport/browser -run 'DOM|Find' -v

  # The installer jobs run only when the installers (or their tests) change, plus weekly and on
  # manual dispatch, to save CI time.
  installer-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = pull_request ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(install\.(sh|ps1)|scripts/test-installers\.(sh|ps1)|\.github/workflows/ci\.yml|cmd/sourcebolt/.*|internal/setup/.*)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  installer-unix:
    needs: installer-changes
    if: needs.installer-changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck --shell=sh install.sh scripts/test-installers.sh
      - name: offline tests (tampered checksums, PATH blocks, uninstall)
        run: sh scripts/test-installers.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The offline tests use a stand-in binary. This step installs this commit's real binary,
      # so a CLI change that breaks the installer (for example `setup --help` not exiting 0)
      # fails here. HOME is a temp folder: no real app config is touched.
      - name: this commit's binary through install.sh, then setup writes the installed path
        run: |
          os="$(uname -s | tr 'A-Z' 'a-z')"
          case "$(uname -m)" in x86_64) arch=amd64 ;; *) arch=arm64 ;; esac
          a="sourcebolt_9.9.9_${os}_${arch}.tar.gz"
          rel="$RUNNER_TEMP/rel/v9.9.9"; mkdir -p "$rel" "$RUNNER_TEMP/pkg"
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/candidloom-hub/sourcebolt/internal/version.Version=9.9.9" -o "$RUNNER_TEMP/pkg/sourcebolt" ./cmd/sourcebolt
          tar -czf "$rel/$a" -C "$RUNNER_TEMP/pkg" sourcebolt
          (cd "$rel" && shasum -a 256 "$a" >checksums.txt)
          h="$RUNNER_TEMP/e2e-home"; mkdir -p "$h/.cursor"
          export HOME="$h" XDG_CONFIG_HOME="$h/.config" NOTEBOOKLM_CONFIG_DIR="$h/sbdata" NOTEBOOKLM_BROWSER_FALLBACK=0
          SOURCEBOLT_DOWNLOAD_BASE="file://$RUNNER_TEMP/rel" sh install.sh --version v9.9.9 --dir "$h/bin" --no-setup --no-modify-path | tee "$RUNNER_TEMP/e2e.txt"
          grep -qx 'Installed: sourcebolt 9.9.9' "$RUNNER_TEMP/e2e.txt"
          grep -q "Next step: run 'sourcebolt setup'" "$RUNNER_TEMP/e2e.txt"
          # Exit 1 is expected: --no-login leaves no session, so the closing checks report it.
          code=0; "$h/bin/sourcebolt" setup --no-login --yes --client cursor || code=$?
          test "$code" -le 1
          grep -qF "\"$h/bin/sourcebolt\"" "$h/.cursor/mcp.json"
          "$h/bin/sourcebolt" setup --undo --client cursor
          test ! -e "$h/.cursor/mcp.json"
      - name: install cosign (exercises the signature check)
        if: runner.os == 'Linux'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: install the published v0.2.0 into a temp prefix
        run: |
          sh install.sh --version v0.2.0 --dir "$RUNNER_TEMP/sb" --no-setup --no-modify-path | tee "$RUNNER_TEMP/out.txt"
          grep -qx 'Installed: sourcebolt 0.2.0' "$RUNNER_TEMP/out.txt"
          test "$("$RUNNER_TEMP/sb/sourcebolt" --version)" = "sourcebolt 0.2.0"
          if command -v cosign >/dev/null; then grep -q 'signature verified (cosign)' "$RUNNER_TEMP/out.txt"; fi
      - name: piped form, latest release, PATH block, upgrade, uninstall
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo candidloom-hub/sourcebolt --json tagName -q .tagName)"
          cat install.sh | SOURCEBOLT_INSTALL_DIR="$RUNNER_TEMP/sb2" sh -s -- --no-setup
          test "$("$RUNNER_TEMP/sb2/sourcebolt" --version)" = "sourcebolt ${latest#v}"
          cat install.sh | SOURCEBOLT_INSTALL_DIR="$RUNNER_TEMP/sb2" sh -s -- --no-setup | grep upgraded
          cat install.sh | sh -s -- --uninstall --dir "$RUNNER_TEMP/sb2"
          test ! -e "$RUNNER_TEMP/sb2/sourcebolt"
          ! grep -s 'added by sourcebolt installer' ~/.zshrc ~/.bashrc ~/.bash_profile ~/.profile

  installer-windows:
    needs: installer-changes
    if: needs.installer-changes.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: offline tests, Windows PowerShell 5.1 (also checks the user PATH entry)
        shell: powershell
        run: .\scripts\test-installers.ps1 -TestUserPath
      - name: offline tests, PowerShell 7
        shell: pwsh
        run: .\scripts\test-installers.ps1 -Shell pwsh
      # Same check as installer-unix: this commit's real binary, a fake home, setup for Cursor.
      - name: this commit's binary through install.ps1, then setup writes the installed path
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = "$env:RUNNER_TEMP\rel\v9.9.9"; $pkg = "$env:RUNNER_TEMP\pkg"
          New-Item -ItemType Directory -Force -Path $rel, $pkg | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-X github.com/candidloom-hub/sourcebolt/internal/version.Version=9.9.9" -o "$pkg\sourcebolt.exe" ./cmd/sourcebolt
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $zip = "$rel\sourcebolt_9.9.9_windows_amd64.zip"
          Compress-Archive -Path "$pkg\sourcebolt.exe" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$rel\checksums.txt", "$hash  sourcebolt_9.9.9_windows_amd64.zip`n")
          $h = "$env:RUNNER_TEMP\e2e-home"
          New-Item -ItemType Directory -Force -Path "$h\.cursor", "$h\AppData\Roaming", "$h\AppData\Local" | Out-Null
          $env:USERPROFILE = $h; $env:HOME = $h; $env:APPDATA = "$h\AppData\Roaming"; $env:LOCALAPPDATA = "$h\AppData\Local"
          $env:NOTEBOOKLM_CONFIG_DIR = "$h\sbdata"; $env:NOTEBOOKLM_BROWSER_FALLBACK = '0'
          $env:SOURCEBOLT_DOWNLOAD_BASE = 'file:///' + ("$env:RUNNER_TEMP\rel" -replace '\\', '/')
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Version v9.9.9 -InstallDir "$h\bin" -NoSetup -NoModifyPath
          $out | Write-Host
          if (-not ($out -contains 'Installed: sourcebolt 9.9.9')) { throw 'success line missing' }
          if (-not ($out -match "Next step: run 'sourcebolt setup'")) { throw 'installer did not detect setup' }
          & "$h\bin\sourcebolt.exe" setup --no-login --yes --client cursor
          if ($LASTEXITCODE -gt 1) { throw "setup failed: $LASTEXITCODE" }
          $cmd = (Get-Content -Raw "$h\.cursor\mcp.json" | ConvertFrom-Json).mcpServers.sourcebolt.command
          # setup writes the resolved path (long names, not 8.3), so compare the file, not the spelling.
          $want = "$h\bin\sourcebolt.exe"
          if (-not ($cmd -like '*\e2e-home\bin\sourcebolt.exe' -and (Test-Path -LiteralPath $cmd) -and
                  (Get-FileHash -LiteralPath $cmd).Hash -eq (Get-FileHash -LiteralPath $want).Hash)) { throw "setup wrote '$cmd'" }
          & "$h\bin\sourcebolt.exe" setup --undo --client cursor
          if (Test-Path "$h\.cursor\mcp.json") { throw 'undo left mcp.json' }
          $global:LASTEXITCODE = 0
      - name: install the published v0.2.0 into a temp prefix (5.1, -File)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Version v0.2.0 -InstallDir "$env:RUNNER_TEMP\sb" -NoSetup -NoModifyPath | Tee-Object -Variable out
          if (-not ($out -contains 'Installed: sourcebolt 0.2.0')) { throw 'success line missing' }
          $v = & "$env:RUNNER_TEMP\sb\sourcebolt.exe" --version
          if ($v -ne 'sourcebolt 0.2.0') { throw "unexpected version: $v" }
      - name: iex form, latest release, upgrade, scriptblock -Uninstall (PowerShell 7)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCEBOLT_NO_SETUP: "1"
        run: |
          $latest = gh release view --repo candidloom-hub/sourcebolt --json tagName -q .tagName
          $env:SOURCEBOLT_INSTALL_DIR = "$env:RUNNER_TEMP\sb2"
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw "installer failed: $LASTEXITCODE" }
          $v = & "$env:RUNNER_TEMP\sb2\sourcebolt.exe" --version
          if ($v -ne "sourcebolt $($latest.TrimStart('v'))") { throw "unexpected version: $v" }
          Get-Content .\install.ps1 -Raw | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw "re-run failed: $LASTEXITCODE" }
          & ([scriptblock]::Create((Get-Content .\install.ps1 -Raw))) -Uninstall
          if (Test-Path "$env:RUNNER_TEMP\sb2\sourcebolt.exe") { throw 'binary still present' }
          $p = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($p -like "*$env:RUNNER_TEMP\sb2*") { throw 'PATH entry still present' }
